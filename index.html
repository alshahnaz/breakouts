<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breakouts">
<meta name="theme-color" content="#0b0f14">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Breakouts</title>
<style>
:root{--bg:#0b0f14;--card:#141a22;--line:#222b36;--tx:#e6edf3;--mut:#8b98a5;--g:#00c853;--r:#ff5252;--b:#2f81f7;--y:#ffb300;--o:#ff7043}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:22px;font-weight:700}
header .sub{color:var(--mut);font-size:12px;margin-top:2px}
.mk{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;margin-left:6px;vertical-align:middle}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 80px)}
.sec{margin:14px 0 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sym{font-weight:700;font-size:16px}
.tag{font-size:11px;padding:2px 7px;border-radius:8px;font-weight:600;white-space:nowrap}
.LEADER{background:#ffb30033;color:#ffd54f}.IGNITION{background:#2f81f733;color:#79b8ff}.TURNAROUND{background:#ff704333;color:#ffab91}
.mut{color:var(--mut);font-size:12px}
.g{color:var(--g)}.r{color:var(--r)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.kv div{background:#0f141b;border-radius:8px;padding:6px 8px}
.kv b{display:block;font-size:14px}.kv span{font-size:10px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:22px 8px;font-size:14px}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin:10px 0}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:8px 4px;border-radius:8px;font-size:13px;font-weight:600}
.seg button.on{background:#273140;color:var(--tx)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0f141bf2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 6px;font-size:10px}
nav button i{display:block;font-style:normal;font-size:20px;margin-bottom:1px}
nav button.on{color:var(--b)}
input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line)}
.li .st{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:6px}
.BUY{background:#00c85333;color:var(--g)}.bar{height:6px;background:#273140;border-radius:3px;position:relative;margin-top:8px}.bar i{position:absolute;top:-3px;width:3px;height:12px;background:#fff;border-radius:2px}.OPEN{background:#2f81f733;color:#79b8ff}
.btn{border:0;background:#273140;color:var(--tx);border-radius:8px;padding:6px 10px;font-size:13px}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
#sheet.show{display:flex}
#sheet .top{padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
#sheet .top .sym{flex:1}
#chart{flex:1;min-height:0}
#info{padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line);font-size:13px}
.note{font-size:12px;color:var(--mut);line-height:1.5}
.pill{display:inline-block;background:#0f141b;border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Breakouts <span id="mkt" class="mk"></span></h1>
  <div class="sub" id="upd">Loading…</div>
</header>
<main id="view"></main>
<nav>
  <button data-v="pf" class="on"><i>📦</i>Portfolio</button>
  <button data-v="sig"><i>⚡</i>Signals</button>
  <button data-v="open"><i>📒</i>Tracker</button>
  <button data-v="watch"><i>⭐</i>Watch</button>
  <button data-v="search"><i>🔍</i>Search</button>
  <button data-v="about"><i>ℹ️</i>Rules</button>
</nav>
<div id="sheet">
  <div class="top"><button class="btn" id="back">‹ Back</button><div class="sym" id="csym"></div><button class="btn" id="cstar">☆</button></div>
  <div id="chart"></div>
  <div id="info"></div>
</div>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const $=s=>document.querySelector(s), V=$("#view");
let S=null, ALL=[], view="pf", sigTab="all", chart=null;
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let watch=LS.get("watch",null);
const fmt=(x,d=2)=>x==null?"–":Number(x).toLocaleString("en-IN",{maximumFractionDigits:d,minimumFractionDigits:d});
const pc=x=>x==null?"–":`<span class="${x>=0?'g':'r'}">${x>=0?'+':''}${fmt(x,1)}%</span>`;
const nm={LEADER:"⭐ Leader",IGNITION:"🚀 Ignition",TURNAROUND:"🔄 Turnaround"};
const tag=s=>`<span class="tag ${s}">${nm[s]||s}</span>`;

let KEY=null;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(t){const a=b64(t.trim());return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:a.slice(0,12)},KEY,a.slice(12))))}
async function getJ(p){return dec(await (await fetch(p)).text())}
async function mkKey(pw,L){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(L.salt),iterations:L.iter,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])}
async function unlock(){
  const L=await (await fetch("data/lock.json?t="+Date.now())).json();
  let pw=LS.get("pw",null);
  while(true){
    if(pw){try{KEY=await mkKey(pw,L);const ok=await dec(L.check).catch(()=>null);if(ok===null)throw 0;LS.set("pw",pw);return}catch(e){KEY=null}}
    pw=await askPw(pw?"Wrong password, try again":"");
  }
}
function askPw(msg){return new Promise(res=>{
  V.innerHTML=`<div class="card" style="margin-top:40px;text-align:center"><div style="font-size:40px">🔒</div><b>Enter your app password</b><div class="mut" style="margin:6px 0 12px">${msg||"Saved on this phone after the first time."}</div><input id="pw" type="password" autocomplete="current-password"><button class="btn" id="pwgo" style="margin-top:10px;width:100%;padding:12px;background:#2f81f7">Unlock</button></div>`;
  const go=()=>res($("#pw").value);$("#pwgo").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()};$("#pw").focus();$("#upd").textContent="Locked";})}
async function load(){
  try{
    if(!KEY) await unlock();
    const b="?t="+Date.now();
    S=await getJ("data/signals.json"+b);
    ALL=await getJ("data/all.json"+b);
    if(watch===null){watch=S.watch_default||[];LS.set("watch",watch)}
    $("#upd").textContent=`Updated ${S.updated} · data ${S.data_date} · ${S.universe} stocks`;
    const m=$("#mkt"); m.textContent=S.nifty.ok?"Market ✓":"Buys paused"; m.style.background=S.nifty.ok?"#00c85333":"#ff525233"; m.style.color=S.nifty.ok?"#00c853":"#ff5252";
  }catch(e){$("#upd").textContent="Couldn't load data";
    if(!S){V.innerHTML=`<div class="card" style="margin-top:30px"><b class="r">Couldn't load the data</b><div class="mut" style="margin:6px 0 12px">${e.message||e}. Check your internet, then tap reload.</div><button class="btn" style="width:100%;padding:12px;background:#2f81f7" onclick="hardReload()">Reload app</button></div>`;return}}
  render();
}
const RES={target:"🟢 Target hit",stop:"🔴 Stopped",time:"⏱ Time exit",skipped:"⚪ Skipped (gap up)"};
function waitCard(e){const mx=e.sig_close*(1+e.gap_pct/100);return `<div class="card" onclick="openChart('${e.sym}')">
 <div class="row"><span class="sym">${e.sym}</span>${tag(e.setup)}</div>
 <div class="mut" style="margin-top:3px">Signal ${e.sig_date}${e.rank?` · strength #${e.rank}`:""} · close ₹${fmt(e.sig_close)}</div>
 <div class="kv"><div><b>Next open</b><span>Buy at</span></div><div><b class="g">+${e.tgt_pct}%</b><span>Target from buy</span></div><div><b class="r">−${e.stop_pct}%</b><span>Stop (on close)</span></div></div>
 <div class="mut" style="margin-top:6px">⚠️ Skip if it opens above ₹${fmt(mx)} · Qty for ₹15k ≈ ${Math.floor(15000/e.sig_close)||1}. This card moves to 📒 Tracker after tomorrow's open.</div></div>`}
function holdCard(e){const p=Math.max(0,Math.min(100,(e.last-e.stop)/(e.target-e.stop)*100)),pe=(e.entry-e.stop)/(e.target-e.stop)*100;
 return `<div class="card" onclick="openChart('${e.sym}')"${e.sell_next?' style="border-color:#ff5252"':''}>${e.sell_next?'<div class="r" style="font-weight:700;margin-bottom:4px">🔴 SELL at next open – closed below stop</div>':''}
 <div class="row"><span class="sym">${e.sym}</span><span style="font-size:17px;font-weight:700">${pc(e.pnl)}</span></div>
 <div class="row mut" style="margin-top:3px"><span>${tag(e.setup)} · day ${e.days}/${S.rules.maxd}</span><span>bought ${e.entry_date}</span></div>
 <div class="row" style="margin-top:6px;font-size:13px"><span>₹${fmt(e.entry)} → <b>₹${fmt(e.last)}</b></span><span class="mut">best ${pc(e.best)} · worst ${pc(e.worst)}</span></div>
 <div class="bar" style="background:linear-gradient(90deg,#ff525266 0%,#273140 ${pe}%,#00c85366 100%)"><i style="left:calc(${p}% - 1px)"></i></div>
 <div class="row mut" style="font-size:11px;margin-top:4px"><span>Stop ₹${fmt(e.stop)}</span><span>Target ₹${fmt(e.target)}</span></div></div>`}
function closedRow(e){return `<div class="li" onclick="openChart('${e.sym}')"><span><b>${e.sym}</b> ${tag(e.setup)}<div class="mut">${RES[e.status]} · ${e.status==="skipped"?`opened ₹${fmt(e.open_px)} on ${e.entry_date}`:`${e.entry_date} → ${e.exit_date} · ${e.days}d`}</div></span>${e.status==="skipped"?'<span class="mut">no trade</span>':pc(e.pnl)}</div>`}
let trTab="hold";
function render(){try{render0()}catch(e){V.innerHTML=`<div class="card" style="margin-top:30px"><b class="r">Couldn't show the data</b><div class="mut" style="margin:6px 0 12px">${e.message}</div><button class="btn" style="width:100%;padding:12px;background:#2f81f7" onclick="hardReload()">Reload app</button></div>`}}
async function hardReload(){try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));const rs=await navigator.serviceWorker?.getRegistrations();if(rs)await Promise.all(rs.map(r=>r.unregister()))}catch(e){}location.replace(location.pathname+"?r="+Date.now())}
function render0(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  if(!S){V.innerHTML='<div class="empty">Loading…</div>';return}
  if(view==="pf"){
    const P=S.portfolio; if(!P){V.innerHTML='<div class="empty">Portfolio data comes with the next scan.</div>';return}
    const inv=P.mode==="INVESTED", per=Math.round(150000/P.n);
    let h=`<div class="card" style="border-color:${inv?'#00c85366':'#ffb30066'}"><div class="row"><b style="font-size:18px">${inv?'🟢 INVESTED':'🟡 IN CASH'}</b><span class="mut">decided ${P.decided}</span></div>
      <p class="note">${inv?`Hold these ${P.holdings.length} stocks, about ₹${fmt(per,0)} each (₹1.5L ÷ ${P.n}). Check again at the next weekly review.`:`Market switch is OFF: Nifty fell more than ${P.band??4}% below its 200-day average and has not yet climbed ${P.band??4}% above it. The rule is to <b>hold no stocks</b> – keep the money in a liquid fund / LIQUIDBEES and wait. It switches back on automatically.`}</p>
      <div class="mut">Next review: <b>${P.next_review}</b>, after the close. Nifty now ${fmt(P.nifty,0)} vs 200-day avg ${fmt(P.n200,0)} (${P.gap200>0?'+':''}${P.gap200}%). Switch turns ${inv?'OFF below −':'ON above +'}${P.band??4}%.</div></div>`;
    const L0=P.log[0];
    if(P.act_tomorrow&&L0&&(L0.buys.length||L0.sells.length)) h+=`<div class="card" style="border-color:#2f81f7"><b>📣 Do this at tomorrow's open</b>${L0.sells.length?`<div style="margin-top:6px"><b class="r">SELL:</b> ${L0.sells.map(x=>x.sym).join(", ")}</div>`:""}${L0.buys.length?`<div style="margin-top:6px"><b class="g">BUY ₹${fmt(per,0)} each:</b> ${L0.buys.map(x=>x.sym).join(", ")}</div>`:""}</div>`;
    if(inv){const avg=P.holdings.reduce((a,x)=>a+(x.pnl||0),0)/P.holdings.length;
      h+=`<div class="sec"><span>Holdings</span><span>avg ${pc(avg)}</span></div><div class="card" style="padding:4px 14px">${P.holdings.map(x=>`<div class="li" onclick="openChart('${x.sym}')"><span><b>${x.sym}</b><div class="mut">since ${x.since} · rank now ${x.rank??"–"}</div></span><span style="text-align:right">₹${fmt(x.entry)} → ₹${fmt(x.now)}<div>${pc(x.pnl)}</div></span></div>`).join("")}</div>`;}
    h+=`<div class="sec"><span>Weekly decisions (saved)</span><span>${P.log.length}</span></div>`+(P.log.length?P.log.map(l=>`<div class="card"><div class="row"><b>${l.date}</b><span class="tag ${l.mode==="CASH"?"TURNAROUND":"BUY"}">${l.mode}</span></div><div class="mut" style="margin-top:4px">Nifty ${fmt(l.nifty,0)} vs 200-day ${fmt(l.n200,0)}</div>${l.sells.length?`<div style="margin-top:4px;font-size:13px"><b class="r">Sold:</b> ${l.sells.map(x=>`${x.sym} ${x.pnl==null?"":(x.pnl>=0?"+":"")+x.pnl+"%"}`).join(", ")}</div>`:""}${l.buys.length?`<div style="margin-top:4px;font-size:13px"><b class="g">Bought:</b> ${l.buys.map(x=>x.sym).join(", ")}</div>`:""}${!l.buys.length&&!l.sells.length?'<div class="mut" style="margin-top:4px">No change</div>':""}</div>`).join(""):"");
    h+=`<div class="sec"><span>Backtest: this portfolio vs Nifty</span></div><div class="card"><table style="width:100%;font-size:13px;text-align:right"><tr class="mut"><td style="text-align:left">Year</td><td>Portfolio</td><td>Nifty 50</td></tr><tr><td style="text-align:left">2012</td><td class="g">+23%</td><td class="g">+5%</td></tr><tr><td style="text-align:left">2013</td><td class="g">+0%</td><td class="g">+7%</td></tr><tr><td style="text-align:left">2014</td><td class="g">+54%</td><td class="g">+31%</td></tr><tr><td style="text-align:left">2015</td><td class="g">+1%</td><td class="r">-4%</td></tr><tr><td style="text-align:left">2016</td><td class="r">-1%</td><td class="g">+3%</td></tr><tr><td style="text-align:left">2017</td><td class="g">+66%</td><td class="g">+29%</td></tr><tr><td style="text-align:left">2018</td><td class="r">-20%</td><td class="g">+3%</td></tr><tr><td style="text-align:left">2019</td><td class="g">+3%</td><td class="g">+12%</td></tr><tr><td style="text-align:left">2020</td><td class="g">+25%</td><td class="g">+15%</td></tr><tr><td style="text-align:left">2021</td><td class="g">+94%</td><td class="g">+24%</td></tr><tr><td style="text-align:left">2022</td><td class="r">-10%</td><td class="g">+4%</td></tr><tr><td style="text-align:left">2023</td><td class="g">+71%</td><td class="g">+20%</td></tr><tr><td style="text-align:left">2024</td><td class="g">+37%</td><td class="g">+9%</td></tr><tr><td style="text-align:left">2025</td><td class="r">-10%</td><td class="g">+11%</td></tr><tr><td style="text-align:left">2026 (to Oct)</td><td class="g">+1%</td><td class="r">-14%</td></tr></table>
      <p class="note">Weekly rotation, 2012–Oct 2026: <b>about 18% a year</b> vs Nifty 10%. Worst drop −32% (Nifty −38%). Losing years: 2018, 2022, 2025. About 2 stocks swapped per week.<br>For comparison, rotating the same list <b>monthly</b> made about 23% a year with a −23% worst drop – weekly trading costs more and reacts to noise.<br>Real-life returns will be lower than this backtest (delisted losers missing, slippage estimated). Expect bad weeks; the edge comes from following every weekly review.</p></div>`;
    V.innerHTML=h;
  } else if(view==="sig"){
    const f=x=>sigTab==="all"||x.setup===sigTab, Jn=S.journal||[];
    const wait=Jn.filter(e=>e.status==="waiting"&&f(e));
    let h=`<div class="seg">${[["all","All"],["LEADER","⭐ Leaders"],["TURNAROUND","🔄 Fell"],["IGNITION","🚀 Near high"]].map(([k,t])=>`<button class="${sigTab===k?'on':''}" onclick="sigTab='${k}';render()">${t}</button>`).join("")}</div>`;
    if(!S.nifty.ok) h+=`<div class="card" style="border-color:#ff525266"><b class="r">Nifty is down ${Math.abs(S.nifty.r20??0)}% in 20 days – 🔄/🚀 breakout buys paused.</b><div class="mut">⭐ Leader signals stay on.</div></div>`;
    h+=`<div class="sec"><span>Buy at next open</span><span>${wait.length}</span></div>`;
    h+=wait.length?wait.map(waitCard).join(""):`<div class="card empty">No new signal today. Every past signal stays in 📒 Tracker until it closes.</div>`;
    if(sigTab==="all"||sigTab==="LEADER"){
      const LH=S.leader_hist||[], byS=Object.fromEntries(LH.map(x=>[x.sym,x]));
      h+=`<div class="sec"><span>⭐ Strongest ${S.leaders.length} now</span><span>buy only on 20-day high</span></div><div class="card" style="padding:4px 14px">${S.leaders.map(x=>{const L=byS[x.sym];return `<div class="li" onclick="openChart('${x.sym}')"><span><span class="mut">#${x.rank}</span> <b>${x.sym}</b><div class="mut">${L?`leader since ${L.first} · ${L.days}d`:""}</div></span><span style="text-align:right">₹${fmt(x.price)}<div class="mut">${L&&L.chg!=null?`since then ${pc(L.chg)}`:""}</div></span></div>`}).join("")}</div>`;
      const old=LH.filter(x=>!x.in_top);
      h+=`<div class="sec"><span>Dropped out of the leader list</span><span>${old.length}</span></div>`;
      h+=old.length?`<div class="card" style="padding:4px 14px">${old.map(x=>`<div class="li" onclick="openChart('${x.sym}')"><span><b>${x.sym}</b><div class="mut">leader ${x.first} → ${x.last} (${x.days}d, best #${x.best_rank})</div></span><span style="text-align:right">₹${fmt(x.first_px)} → ₹${fmt(x.now)}<div>${pc(x.chg)}</div></span></div>`).join("")}</div>`:`<div class="empty">None yet</div>`;
    }
    const st=S.stats_2y;
    h+=`<div class="sec"><span>Backtest, last 2 years</span></div><div class="card">${Object.keys(st).map(k=>`<div class="row" style="padding:4px 0">${tag(k)}<span class="mut">${st[k].trades} trades · ${st[k].win_pct??"–"}% won · avg ${st[k].avg_pct==null?"–":(st[k].avg_pct>=0?"+":"")+st[k].avg_pct+"%"}</span></div>`).join("")}</div>`;
    V.innerHTML=h;
  } else if(view==="open"){
    const Jn=S.journal||[], hold=Jn.filter(e=>e.status==="open").sort((a,b)=>(b.sell_next-a.sell_next)||(b.pnl-a.pnl)),
      wait=Jn.filter(e=>e.status==="waiting"), cl=Jn.filter(e=>["target","stop","time"].includes(e.status)).sort((a,b)=>a.exit_date<b.exit_date?1:-1), sk=Jn.filter(e=>e.status==="skipped");
    const win=cl.filter(e=>e.pnl>0).length, avg=cl.length?cl.reduce((a,e)=>a+e.pnl,0)/cl.length:0, rs=cl.reduce((a,e)=>a+150*e.pnl,0), ro=hold.reduce((a,e)=>a+150*e.pnl,0);
    let h=`<div class="card"><b>Every signal since ${S.since}</b><div class="kv"><div><b>${Jn.length}</b><span>Signals</span></div><div><b>${hold.length}</b><span>Holding</span></div><div><b>${cl.length}</b><span>Closed</span></div>
      <div><b>${cl.length?Math.round(100*win/cl.length)+"%":"–"}</b><span>Won (${win}/${cl.length})</span></div><div><b class="${rs>=0?'g':'r'}">₹${fmt(rs,0)}</b><span>Booked @₹15k each</span></div><div><b class="${ro>=0?'g':'r'}">₹${fmt(ro,0)}</b><span>Open P&L</span></div></div>
      <div class="mut" style="margin-top:6px">Signals are saved the day they appear and followed with their own fixed buy, target and stop – nothing disappears when rankings change.</div></div>`;
    h+=`<div class="seg">${[["hold",`Holding ${hold.length}`],["wait",`Waiting ${wait.length}`],["closed",`Closed ${cl.length}`],["skip",`Skipped ${sk.length}`]].map(([k,t])=>`<button class="${trTab===k?'on':''}" onclick="trTab='${k}';render()">${t}</button>`).join("")}</div>`;
    if(trTab==="hold") h+=hold.length?hold.map(holdCard).join(""):`<div class="empty">Nothing held right now</div>`;
    if(trTab==="wait") h+=wait.length?wait.map(waitCard).join(""):`<div class="empty">No signal waiting for tomorrow's open</div>`;
    if(trTab==="closed") h+=cl.length?`<div class="card" style="padding:4px 14px">${cl.map(closedRow).join("")}</div>`:`<div class="empty">No closed trades yet</div>`;
    if(trTab==="skip") h+=sk.length?`<div class="card" style="padding:4px 14px">${sk.map(closedRow).join("")}</div>`:`<div class="empty">None</div>`;
    V.innerHTML=h;
  } else if(view==="watch"){
    const map=Object.fromEntries(ALL.map(r=>[r[0],r]));
    V.innerHTML=`<div class="sec"><span>Watchlist</span><span>${watch.length}</span></div>`+(watch.length?watch.map(s=>{const r=map[s];return `<div class="li" onclick="openChart('${s}')"><span><b>${s}</b>${r&&r[3]?`<span class="st ${r[3]}">${r[3]}</span>`:""}</span><span>${r?`₹${fmt(r[1])} &nbsp;${pc(r[2])}`:'<span class="mut">not in scan list</span>'}</span></div>`}).join(""):`<div class="empty">Empty. Open any stock and tap ☆ to add.</div>`);
  } else if(view==="search"){
    V.innerHTML=`<input id="q" placeholder="Search NSE symbol e.g. JINDALPOLY" autocapitalize="characters" autocomplete="off"><div id="res"></div>`;
    const q=$("#q"), res=$("#res");
    const go=()=>{const t=q.value.trim().toUpperCase();const L=(t?ALL.filter(r=>r[0].includes(t)):ALL.filter(r=>r[3])).slice(0,60);
      res.innerHTML=L.map(r=>`<div class="li" onclick="openChart('${r[0]}')"><span><b>${r[0]}</b>${r[3]?`<span class="st ${r[3]}">${r[3]}</span>`:""}</span><span>₹${fmt(r[1])} &nbsp;${pc(r[2])}</span></div>`).join("")||'<div class="empty">No match</div>'};
    q.oninput=go; go();
  } else {
    const R=S.rules;
    V.innerHTML=`<div class="card"><b>📦 Portfolio – the main strategy</b><p class="note">Every week, on the <b>first trading day of the week, after the close</b>: if Nifty is above its 200-day average, hold the <b>${S.portfolio?.n??20} strongest stocks</b> (12-month gain, skipping the latest month, divided by how much the stock swings), only liquid ones (₹${S.portfolio?.minturn??10} cr+ traded a day), above their 200-day average and within 25% of their 1-year high. Keep a holding while it stays in the top ${2*(S.portfolio?.n??20)}; replace the rest. Market switch: if Nifty closes a review day more than 4% below its 200-day average → sell everything and sit in cash; buy again once it is 4% above. Equal money in each stock. No stop-losses, no daily decisions.</p></div>
    <div class="card"><b>⭐ Leader – swing signals (experimental)</b><p class="note">Every day all stocks are ranked by <b>6-month + 3-month gain divided by how much they swing</b> (smooth, steady climbers rank highest), keeping liquid stocks above their 200-day average. When a <b>top-${R.l_top??30}</b> stock closes at a <b>new 20-day high</b> within 8% of its 52-week high → buy next open (skip if it opens more than 3% up). Sell at <b class="g">+${R.l_tgt??10}%</b>, or if a day <b class="r">closes ${R.l_stop??30}% below</b> entry, or after 120 days. Works even when Nifty falls.<br><b>Backtest win rate: 2012-19 79% · 2020-23 84% · 2024-26 77% · 2026 89%.</b><br>The catch: a losing trade averages about −20%, so one loss wipes out about two wins. Average profit per trade ≈ +2…+5%.</p></div>
    <div class="card"><b>🔄 Turnaround – the JINDALPOLY type</b><p class="note">Stock had fallen and is still <b>10–20% below its 52-week high</b>. Then money floods in: average daily turnover of the last 10 days is <b>≥${R.tr}× the normal of the previous 100 days</b>, price closes at a <b>new 60-day closing high</b> and is <b>up ${R.r20}–${R.r20max??25}% in 20 days</b>.</p></div>
    <div class="card"><b>🚀 Ignition</b><p class="note">Same turnover surge + 60-day high, but the stock is already within 10% of its 52-week high. Usually the stronger of the two.</p></div>
    <div class="card"><b>How to trade a signal</b><p class="note">Buy at next morning's open – <b>skip if it opens more than ${R.gap??2}% above</b> the signal close · Sell at <b class="g">+${R.target}%</b> · Stop is on <b>closing price</b>: only if a day <b class="r">closes ${R.stop}% below</b> your buy, sell next morning (intraday dips are ignored) · If neither in ${R.maxd} trading days, sell. Max ₹15,000 per stock, max 10 stocks.</p></div>
    <div class="card"><b>Quality filters (v2)</b><p class="note">No new buys while Nifty is down over 20 days · skip stocks more than ${R.ext??20}% above their 20-day average or swinging more than ${R.atr??4.5}% a day · skip if already up more than ${R.r20max??25}% in 20 days. Backtest (2020-26): <b>64% winners, +7.9% per trade</b>; 2024-26: 54% winners, +3.9% (old rules: 40%, +1.9%).</p></div>
    <div class="card"><b>Be honest with yourself</b><p class="note">Around 1 in 2 trades still loses, and a closing stop can occasionally lose more than 20% on a gap down. Signals more than 20% below the high <b>lost money</b> in 2024-26 backtests, so the app ignores them. The Turnaround setup is the weaker of the two – check its live stats on the Signals tab. Past results don't guarantee the future. Data is end-of-day from Yahoo and refreshes every weekday evening. Not investment advice.</p></div>`;
  }
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;render();window.scrollTo(0,0)});

async function openChart(sym){
  $("#sheet").classList.add("show"); $("#csym").textContent=sym; $("#info").innerHTML='<span class="mut">Loading…</span>';
  $("#cstar").textContent=watch.includes(sym)?"★":"☆"; $("#cstar").onclick=()=>{const i=watch.indexOf(sym);i<0?watch.unshift(sym):watch.splice(i,1);LS.set("watch",watch);$("#cstar").textContent=watch.includes(sym)?"★":"☆";if(view==="watch")render()};
  const el=$("#chart"); el.innerHTML=""; if(chart){chart.remove();chart=null}
  let d; try{d=await getJ(`data/c/${sym}.json?t=${S?S.data_date:""}`)}catch(e){$("#info").innerHTML='<span class="r">No chart data for '+sym+'</span>';return}
  if(!window.LightweightCharts){$("#info").innerHTML='<span class="r">Chart library failed to load (needs internet).</span>';return}
  chart=LightweightCharts.createChart(el,{width:el.clientWidth,height:el.clientHeight,layout:{background:{color:"#0b0f14"},textColor:"#8b98a5"},grid:{vertLines:{color:"#161d26"},horzLines:{color:"#161d26"}},rightPriceScale:{borderColor:"#222b36"},timeScale:{borderColor:"#222b36"},crosshair:{mode:0}});
  const cs=chart.addCandlestickSeries({upColor:"#00c853",downColor:"#ff5252",borderVisible:false,wickUpColor:"#00c853",wickDownColor:"#ff5252"});
  cs.setData(d.c.map(r=>({time:r[0],open:r[1],high:r[2],low:r[3],close:r[4]})));
  const vs=chart.addHistogramSeries({priceFormat:{type:"volume"},priceScaleId:"v"}); chart.priceScale("v").applyOptions({scaleMargins:{top:.8,bottom:0}});
  vs.setData(d.c.map(r=>({time:r[0],value:r[5]*r[4],color:r[4]>=r[1]?"#00c85355":"#ff525255"})));
  const sma=(n)=>{const o=[];let s=0;d.c.forEach((r,i)=>{s+=r[4];if(i>=n)s-=d.c[i-n][4];if(i>=n-1)o.push({time:r[0],value:s/n})});return o};
  chart.addLineSeries({color:"#ffb300",lineWidth:1,priceLineVisible:false,lastValueVisible:false}).setData(sma(50));
  chart.addLineSeries({color:"#2f81f7",lineWidth:1,priceLineVisible:false,lastValueVisible:false}).setData(sma(200));
  const M={sig:["belowBar","#ffb300","arrowUp","SIGNAL"],buy:["belowBar","#2f81f7","arrowUp","BUY"],target:["aboveBar","#00c853","arrowDown","TARGET"],stop:["aboveBar","#ff5252","arrowDown","STOP"],time:["aboveBar","#8b98a5","arrowDown","TIME"]};
  cs.setMarkers(d.m.map(m=>{const k=M[m[1]];let t=k[3];if(m[1]==="buy")t+=` ${m[3]==="TURNAROUND"?"🔄":"🚀"}`;if(["target","stop","time"].includes(m[1]))t+=` ${m[2]>0?"+":""}${m[2]}%`;return{time:m[0],position:k[0],color:k[1],shape:k[2],text:t}}).sort((a,b)=>a.time<b.time?-1:1));
  d.l.forEach(l=>cs.createPriceLine({price:l.v,color:l.c,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:l.t}));
  chart.timeScale().setVisibleLogicalRange({from:Math.max(0,d.c.length-160),to:d.c.length+3});
  const last=d.c[d.c.length-1], row=ALL.find(r=>r[0]===sym);
  const hi=Math.max(...d.c.slice(-252).map(r=>r[2]));
  $("#info").innerHTML=`<span class="pill">₹${fmt(last[4])} ${row?pc(row[2]):""}</span><span class="pill">${fmt((last[4]/hi-1)*100,1)}% from 1y high</span>${row&&row[3]?`<span class="pill st ${row[3]}">${row[3]}</span>`:""}<div class="mut" style="margin-top:6px">🟡 signal · 🔵 buy · 🟢 target · 🔴 stop · bars at bottom = turnover · yellow 50DMA · blue 200DMA</div>`;
}
$("#back").onclick=()=>{$("#sheet").classList.remove("show");if(chart){chart.remove();chart=null}};
window.addEventListener("resize",()=>{if(chart){const el=$("#chart");chart.resize(el.clientWidth,el.clientHeight)}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=2").catch(()=>{});
load();
</script>
