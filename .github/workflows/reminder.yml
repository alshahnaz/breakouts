name: Friday sell reminder

on:
  schedule:
    - cron: "45 8 * * 5"      # Friday 2:15 PM IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy cryptography
      - run: python scan.py --reminder
        env:
          APP_PASS: ${{ secrets.APP_PASS }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASS: ${{ secrets.MAIL_APP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
